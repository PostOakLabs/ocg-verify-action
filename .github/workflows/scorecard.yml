name: Scorecard analysis workflow

# OVI-SCORECARD-1: OpenSSF Scorecard is self-maintaining CI (SO #0 clean) —
# runs on a GitHub schedule, publishes to api.scorecard.dev, zero local
# upkeep. Pinned by full commit SHA per SO #32; taken from ossf/scorecard's
# own canonical example workflow (.github/workflows/scorecard-analysis.yml
# on main), the SHA set the Scorecard team itself keeps current.
on:
  push:
    # Only the default branch is supported.
    branches: [main]
  schedule:
    # Weekly on Saturdays.
    - cron: '30 1 * * 6'
  workflow_dispatch: {}

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed for Code scanning upload
      security-events: write
      # Needed for GitHub OIDC token, publish_results: true
      id-token: write

    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Run analysis"
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Scorecard team runs a weekly scan of public GitHub repos;
          # publish_results: true hands them our own run instead, and
          # is required to enable the README badge. Free, no local cost.
          publish_results: true

      - name: "Upload artifact"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: "Upload to code-scanning"
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: results.sarif
