name: ci2

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: A7 fixture conformance (golden PASS / tampered FAIL / snapshot-batch per-entry)
        run: node test/run-fixtures.mjs

  self-test:
    runs-on: ubuntu-latest
    needs: fixtures
    steps:
      - uses: actions/checkout@v4
      - name: Run the Action against its own fixtures (expect 1 fail: tampered.receipt.json)
        id: verify
        uses: ./
        continue-on-error: true
      - name: Assert the Action correctly reported a failure
        run: |
          if [ "${{ steps.verify.outcome }}" != "failure" ]; then
            echo "expected the Action to exit non-zero on fixtures/tampered.receipt.json, got outcome=${{ steps.verify.outcome }}"
            exit 1
          fi
          echo "confirmed: self-test run failed as expected on the tampered fixture"
